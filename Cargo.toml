[package]
name = "sudanese-pound-agen-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
lambda_runtime = "0.13"
aws_lambda_events = "0.16"

reqwest = { version = "0.12", features = ["json"] }

dotenv = "0.15"